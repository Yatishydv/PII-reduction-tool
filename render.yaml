services:
  - type: web
    name: pii-redaction-tool
    env: python
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn api.app:app --host 0.0.0.0 --port $PORT --limit-max-requests 200 --timeout-keep-alive 5"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONOPTIMIZE
        value: "1"
